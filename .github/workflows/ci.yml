name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # On JDK 25 the quality profile is active: Spotless format check and Error Prone.
      - name: Build, test, format check, static analysis
        run: mvn -B verify

      - name: Generated docs are up to date
        run: |
          python3 tools/upstream-extract/gen_matrix.py
          python3 tools/upstream-extract/gen_reference.py
          git diff --exit-code docs/parity-matrix.md docs/tool-reference.md

      - name: SBOM (CycloneDX)
        run: mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DoutputFormat=json

      # After the build, so Trivy resolves dependencies from ~/.m2 instead of hitting Maven Central
      # (which rate-limits scanners).
      - name: Trivy (dependencies, secrets, misconfiguration)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: target
          exit-code: "1"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            target/site/jacoco/
            target/bom.json

  image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: librenms-mcp:ci
      - name: Trivy (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: librenms-mcp:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
